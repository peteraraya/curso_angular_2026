<div id="nav" class="w-full px-6">
  <!-- Nueva sintaxis de control de flujo @for introducida en Angular 17.
       Itera sobre el arreglo menuOptions. El 'track' optimiza el re-renderizado
       identificando elementos únicos basados en 'item.route'. -->
  @for (item of menuOptions; track item.route) {
    <!-- [routerLink] es Property Binding para navegar dinámicamente -->
    <!-- routerLinkActive aplica la clase si la ruta coincide -->
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-blue-800"
        class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3  hover:bg-white/5 transition ease-linear duration-150">
        <div>
            <!-- Property Binding en la directiva class para asignar el ícono de FontAwesome -->
            <i [class]="item.icon"></i>
        </div>
        <div class="flex flex-col">
            <span class="text-lg font-bold leading-5 text-white">{{ item.label }}</span>
            <span class="text-sm text-white/50 hidden md:block">{{ item.subLabel }}</span>
        </div>
    </a>
  }


  <!-- Segunda sección: Historial de búsquedas.
       Iteramos sobre las claves (términos de búsqueda) obtenidas dinámicamente desde el signal 
       'searchHistoryKeys()' en el GifsService. -->
  @for (key of gifsService.searchHistoryKeys(); track key) {

     <!-- Al hacer clic en un término del historial, navegamos nuevamente a la página de búsqueda.
          Más adelante se puede pasar el parámetro para que cargue automáticamente. -->
     <a
      [routerLink]="['/dashboard/history', key]" // enviamos parametro de key
      routerLinkActive="bg-blue-800"
        class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3  hover:bg-white/5 transition ease-linear duration-150">
        <div>
            <!-- Property Binding en la directiva class para asignar el ícono de FontAwesome -->
            <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <div class="flex flex-col">
            <!-- Interpolación para mostrar la clave (término buscado) -->
            <span class="text-lg font-bold leading-5 text-white">{{ key }}</span>
        </div>
    </a>

  }
</div>
