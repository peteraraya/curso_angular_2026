
<!-- Título que muestra el término de búsqueda actual obtenido desde la URL -->
<h3 class="text-2xl font-bold capitalize">
    Mostrando : {{ query() }}
</h3>

<!-- Sección principal que despliega el historial de la búsqueda actual -->
<section class="py-5">
    <!-- Componente anidado: renderiza la lista de Gifs usando <gifs-list> -->
    <!-- Property Binding: [gifs]="gifsByKey()" le pasa el valor actual de la computed signal 'gifsByKey'
         hacia el Signal Input (input.required) que define el componente <gifs-list>. -->
    <gifs-list [gifs]="gifsByKey()" />
</section>
