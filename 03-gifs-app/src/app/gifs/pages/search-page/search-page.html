<h2 class="text-2xl font-bold mt-5">
    Buscar Gifs
</h2>

<h3 class="text-sm text-gray-500">
    Buscar gifs por nombre, descripción o tags
</h3>

<section class="flex flex-col gap-4">

    <input 
        type="text"
        placeholder="Buscar gifs"
        class="mt-3 border border-gray-300 rounded-md p-2"
        (keyup.enter)="onSearch(txtSearch.value)"
        #txtSearch
     />

</section>

<!-- Sección principal de Trending Gifs -->
<section class="py-5">
    <!-- Componente anidado: renderiza la lista de Gifs usando <gifs-list> -->
    <!-- Property Binding: [gifs]="gifs()" le pasa el valor actual de la signal 'gifs'
         hacia el Signal Input (input.required) que define el componente <gifs-list> -->
    <gifs-list [gifs]="gifs()" />
</section>
